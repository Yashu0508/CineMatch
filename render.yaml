services:
  - type: web
    name: cinematch-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: TMDB_ACCESS_TOKEN
        sync: false
      - key: TMDB_API_BASE_URL
        value: https://api.themoviedb.org/3
      - key: TMDB_LANGUAGE
        value: en-US
      - key: TMDB_REGION
        value: IN
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: EMBEDDING_VERSION
        value: v1
      - key: ALLOWED_ORIGINS
        sync: false
